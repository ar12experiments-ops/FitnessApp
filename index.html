<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TransformNXT — Evidence-Based Fitness & Nutrition</title>
  <meta name="description" content="Evidence-based fitness and nutrition platform calibrated for your body composition. Powered by validated ICMR-NIN and ACSM research." />

  <!-- Google Fonts: Plus Jakarta Sans & Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet" />

  <!-- Design System CSS (Dark Liquid Glass Theme) -->
  <link rel="stylesheet" href="css/design-tokens.css" />
  <link rel="stylesheet" href="css/glassmorphism.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/landing.css" />
</head>
<body>

  <!-- Landing Page (Full-Screen Hero — shown on first visit) -->
  <section id="view-landing" class="view-section"></section>

  <div class="app-container" id="app-shell" style="display: none;">
    <!-- Top HUD Header -->
    <header class="hud-header" id="main-header">
      <div class="brand-wrap" id="main-header-brand" style="cursor: pointer;" title="Return to Welcome Screen">
        <div class="brand-logo-icon">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">Transform<span>NXT</span></div>
          <div class="brand-tag">EVIDENCE-BASED FITNESS</div>
        </div>
      </div>

      <!-- Desktop Navigation -->
      <nav class="desktop-nav" id="desktop-navbar">
        <a class="nav-link active" data-view="dashboard">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
          Dashboard
        </a>
        <a class="nav-link" data-view="plan">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
          Weekly Plan
        </a>
        <a class="nav-link" data-view="tracking">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Daily Tracking
        </a>
        <a class="nav-link" data-view="chatbot">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
          AI Coach
        </a>
        <a class="nav-link" data-view="analytics">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"/></svg>
          Analytics
        </a>
      </nav>

      <!-- Profile Pill -->
      <div class="hud-status-tray">
        <div class="profile-pill" id="header-user-btn">
          <span class="beacon-dot optimal"></span>
          <span id="header-user-name">Loading...</span>
        </div>
      </div>
    </header>

    <!-- Main Dynamic Views -->
    <main>
      <section id="view-onboarding" class="view-section"></section>
      <section id="view-dashboard" class="view-section"></section>
      <section id="view-plan" class="view-section"></section>
      <section id="view-tracking" class="view-section"></section>
      <section id="view-chatbot" class="view-section"></section>
      <section id="view-analytics" class="view-section"></section>
      <section id="view-profile" class="view-section"></section>
    </main>
  </div>

  <!-- Sticky Bottom Mobile Glass Navigation -->
  <nav class="mobile-nav" id="mobile-navbar">
    <button class="mobile-nav-btn active" data-view="dashboard">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
      Dashboard
    </button>
    <button class="mobile-nav-btn" data-view="plan">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
      Plan
    </button>
    <button class="mobile-nav-btn" data-view="tracking">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      Track
    </button>
    <button class="mobile-nav-btn" data-view="chatbot">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
      Coach
    </button>
    <button class="mobile-nav-btn" data-view="profile">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      Profile
    </button>
  </nav>

  <!-- Notification Toast -->
  <div id="app-toast" style="position: fixed; top: 20px; right: 20px; z-index: 9999; display: none; background: rgba(13, 18, 36, 0.92); backdrop-filter: blur(16px); border: 1px solid var(--accent-green); color: var(--text-primary); padding: 14px 22px; border-radius: var(--radius-sm); font-size: 0.875rem; font-weight: 600; box-shadow: 0 10px 30px rgba(16, 185, 129, 0.25);"></div>

  <!-- Inbuilt Exercise Video Player Modal -->
  <div id="inbuilt-video-modal" class="inbuilt-video-modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="inbuilt-video-modal-card">
      <div class="inbuilt-video-header">
        <div class="inbuilt-video-title-group">
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
            <span class="telemetry-badge badge-orange" id="video-modal-badge">STRENGTH &bull; CHEST</span>
            <span style="font-size: 0.75rem; color: #DC2626; font-weight: 700; display: flex; align-items: center; gap: 4px;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
              INBUILT PLAYER
            </span>
          </div>
          <h3 id="video-modal-title">Exercise Tutorial</h3>
        </div>
        <button id="btn-close-video-modal" class="inbuilt-video-close-btn" aria-label="Close Video Player">✕</button>
      </div>

      <div class="inbuilt-video-player-container">
        <iframe id="video-modal-iframe" src="" title="Exercise Video Player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>

      <div class="inbuilt-video-meta">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
          <div style="font-size: 0.8125rem; color: var(--text-secondary);">
            Prescription: <strong id="video-modal-prescription" style="color: var(--text-primary);">3 sets &bull; 10-12 reps</strong>
          </div>
          <div id="video-modal-links" style="display: flex; gap: 10px;">
            <a id="video-modal-yt-link" href="#" target="_blank" rel="noopener noreferrer" style="font-size: 0.75rem; color: #DC2626; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; text-decoration: none;">
              Open on YouTube
              <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>
            </a>
          </div>
        </div>
        <div id="video-modal-cues" style="font-size: 0.8125rem; color: var(--text-secondary); line-height: 1.5; background: #F8FAFC; padding: 12px 14px; border-radius: var(--radius-sm); border-left: 3px solid var(--accent-blue);">
          Form instructions will load here...
        </div>
      </div>
    </div>
  </div>

  <!-- Main ES6 Application Bootstrapper -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
